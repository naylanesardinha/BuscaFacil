<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Padrões — Busca Fácil</title>
    <link rel="icon" type="image/png" href="assets/procurar.png">
    <link rel="stylesheet" href="style.css">
   
</head>
<body>

<header class="header-top">
    <div class="logo-menu">
        <img src="assets/logo3.png" alt="Logo">
        <span>Busca Fácil</span>
    </div>
    <nav class="menu">
        <a href="#">
            <i class="fa-solid fa-comments"></i>
            <span>Pesquisas e Feedbacks</span>
        </a>
        <a href="#">
            <i class="fa-solid fa-circle-question"></i>
            <span>Central de atendimento</span>
        </a>
        <a href="#">
            <i class="fa-solid fa-users"></i>
            <span>Sobre nós</span>
        </a>
        <a href="index.html" class="btn-login">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>Sair</span>
        </a>
    </nav>
</header>

<main>
    <header class="header">
        <img src="assets/logo3.png" alt="Logo da empresa" class="logo">
        <h1>VISTORIA <br>VEICULAR</h1>
    </header>

    <div class="search-container">
        <input
            type="text"
            id="search-input"
            placeholder="Ex: Ford Ka 2020"
            class="search-input"
        >
        <button onclick="BuscarVeiculo()" class="search-button">
            <i class="fa-solid fa-magnifying-glass"></i> Buscar
        </button>
    </div>

    <div id="results" class="results-container hidden">

        <div id="chassi-card" class="image-card">
            <div class="card-label">
                <i class="fa-solid fa-car-side"></i> Chassi
            </div>
            <div class="card-img-wrap">
                <img id="chassi-image" alt="Imagem do chassi">
            </div>
        </div>

        <div id="motor-card" class="image-card">
            <div class="card-label">
                <i class="fa-solid fa-gear"></i> Motor
            </div>
            <div class="card-img-wrap">
                <img id="motor-image" alt="Imagem do motor">
            </div>
        </div>

        <div id="message-card" class="image-card hidden">
            <div class="error-card">
                <i id="message-icon" class="fa-solid fa-triangle-exclamation"></i>
                <p id="message-text"></p>
            </div>
        </div>

    </div>
</main>

<footer>
    <p>© 2026 Busca Fácil</p>
</footer>
<script src="script.js"></script>
</body>
</html>
</body>
</html>
